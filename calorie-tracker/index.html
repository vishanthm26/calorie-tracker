<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Calorie Tracker" />
  <title>Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f7f5f0; --card: #fff; --text: #1a1a18; --muted: #7a7870;
      --border: #e8e4dc; --accent: #2d5a27; --accent-light: #e8f2e6;
      --accent-mid: #4a8a42; --warn: #c94f1e; --warn-light: #fdf0eb;
      --protein: #3b6fa0; --carbs: #c17f24; --fat: #8b5e3c;
      --radius: 16px; --font: 'DM Sans', sans-serif; --serif: 'DM Serif Display', serif;
    }
    html, body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }

    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .header h1 { font-family: var(--serif); font-size: 28px; font-weight: 400; letter-spacing: -0.3px; }
    .header-date { font-size: 13px; color: var(--muted); }

    .progress-card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; border: 1px solid var(--border); }
    .progress-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
    .progress-kcal { font-family: var(--serif); font-size: 42px; line-height: 1; }
    .progress-kcal span { font-family: var(--font); font-size: 14px; color: var(--muted); margin-left: 4px; }
    .progress-goal { font-size: 13px; color: var(--muted); }
    .progress-bar-track { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .progress-bar-fill.over { background: var(--warn); }
    .macro-row { display: flex; gap: 8px; margin-top: 14px; }
    .macro-pill { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px; }
    .macro-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .macro-val { font-size: 15px; font-weight: 500; }
    .macro-val.p { color: var(--protein); }
    .macro-val.c { color: var(--carbs); }
    .macro-val.f { color: var(--fat); }

    .log-card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; border: 1px solid var(--border); }
    .section-label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 14px; }

    .meal-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-family: var(--font); font-size: 16px; color: var(--text); outline: none; transition: border-color 0.15s; margin-bottom: 10px; }
    .meal-input:focus { border-color: var(--accent); }
    .meal-input::placeholder { color: #b0ada6; }

    .log-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 15px; font-family: var(--font); font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.15s, transform 0.1s; }
    .log-btn:active { transform: scale(0.98); }
    .log-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

    .estimating { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 12px; }
    .dot-loader { display: flex; gap: 4px; }
    .dot-loader span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
    .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

    .preview-card { background: var(--accent-light); border: 1px solid #c0dabb; border-radius: 12px; padding: 16px; margin-top: 12px; animation: fadeUp 0.25s ease; }
    .preview-card.warn-preview { background: var(--warn-light); border-color: #e8b49a; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .preview-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .preview-kcal { font-size: 28px; font-weight: 600; color: var(--accent); }
    .preview-kcal.over { color: var(--warn); }
    .preview-macros { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .preview-note { font-size: 13px; color: var(--muted); margin-top: 8px; font-style: italic; }
    .preview-warn { font-size: 13px; color: var(--warn); font-weight: 500; margin-top: 6px; }
    .preview-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn-save { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px; font-family: var(--font); font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn-discard { background: transparent; border: 1px solid var(--border); border-radius: 10px; padding: 13px 18px; font-family: var(--font); font-size: 15px; color: var(--muted); cursor: pointer; }

    .error-msg { font-size: 13px; color: var(--warn); margin-top: 10px; }

    .meals-list { display: flex; flex-direction: column; }
    .meal-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; animation: fadeUp 0.2s ease; }
    .meal-item:last-child { border-bottom: none; }
    .meal-time { font-size: 12px; color: var(--muted); min-width: 44px; }
    .meal-name { flex: 1; font-size: 14px; }
    .meal-kcal { font-size: 14px; font-weight: 500; color: var(--accent); }
    .meal-delete { background: none; border: none; cursor: pointer; color: #ccc; font-size: 20px; padding: 0 4px; line-height: 1; }
    .empty-state { text-align: center; padding: 24px 0; color: var(--muted); font-size: 14px; }

    .history-item { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 13px; color: var(--muted); min-width: 88px; }
    .history-bar-wrap { flex: 1; }
    .history-bar-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .history-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
    .history-bar-fill.over { background: var(--warn); }
    .history-kcal { font-size: 13px; font-weight: 500; min-width: 68px; text-align: right; }
    .history-kcal.over { color: var(--warn); }
    .history-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Calorie tracker</h1>
      <span class="header-date" id="today-date"></span>
    </div>

    <div class="progress-card">
      <div class="progress-top">
        <div class="progress-kcal" id="total-kcal">0 <span>kcal today</span></div>
        <div class="progress-goal">of 2100 kcal</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="macro-row">
        <div class="macro-pill"><div class="macro-label">Protein</div><div class="macro-val p" id="total-protein">0g</div></div>
        <div class="macro-pill"><div class="macro-label">Carbs</div><div class="macro-val c" id="total-carbs">0g</div></div>
        <div class="macro-pill"><div class="macro-label">Fat</div><div class="macro-val f" id="total-fat">0g</div></div>
      </div>
    </div>

    <div class="log-card">
      <div class="section-label">Log a meal</div>
      <input class="meal-input" id="meal-input" type="text" placeholder="e.g. 2 chapatis, dal, sabzi" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="log-btn" id="log-btn" onclick="estimateMeal()">Estimate calories</button>
      <div class="estimating" id="estimating-state" style="display:none">
        <div class="dot-loader"><span></span><span></span><span></span></div>
        Estimating…
      </div>
      <div id="error-msg" class="error-msg" style="display:none"></div>
      <div id="preview-area"></div>
    </div>

    <div class="log-card">
      <div class="section-label">Today's meals</div>
      <div class="meals-list" id="meals-list">
        <div class="empty-state">No meals logged yet today</div>
      </div>
    </div>

    <div class="log-card">
      <div class="section-label">Past days</div>
      <div id="history-list"><div class="history-empty">Log meals for a few days to see history</div></div>
    </div>
  </div>

  <script>
    const GOAL = 2100;
    const STORAGE_KEY = 'calorie_log_v1';

    function getTodayKey() { return new Date().toISOString().slice(0,10); }
    function formatDate(k) {
      return new Date(k+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    }
    function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; } catch{return{};} }
    function saveData(d) { try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{} }
    function getToday() {
      const data=loadData(), key=getTodayKey();
      if(!data[key]) data[key]={meals:[]};
      return {data,key};
    }

    function renderTotals() {
      const {data,key}=getToday();
      const meals=data[key]?.meals||[];
      const total=meals.reduce((s,m)=>s+m.kcal,0);
      document.getElementById('total-kcal').innerHTML=`${total} <span>kcal today</span>`;
      document.getElementById('total-protein').textContent=Math.round(meals.reduce((s,m)=>s+(m.protein||0),0))+'g';
      document.getElementById('total-carbs').textContent=Math.round(meals.reduce((s,m)=>s+(m.carbs||0),0))+'g';
      document.getElementById('total-fat').textContent=Math.round(meals.reduce((s,m)=>s+(m.fat||0),0))+'g';
      const fill=document.getElementById('progress-fill');
      fill.style.width=Math.min((total/GOAL)*100,100)+'%';
      fill.classList.toggle('over',total>GOAL);
    }

    function renderMeals() {
      const {data,key}=getToday();
      const meals=data[key]?.meals||[];
      const list=document.getElementById('meals-list');
      if(!meals.length){list.innerHTML='<div class="empty-state">No meals logged yet today</div>';return;}
      list.innerHTML=meals.map((m,i)=>`
        <div class="meal-item">
          <span class="meal-time">${m.time}</span>
          <span class="meal-name">${esc(m.name)}</span>
          <span class="meal-kcal">${m.kcal} kcal</span>
          <button class="meal-delete" onclick="deleteMeal(${i})">×</button>
        </div>`).join('');
    }

    function deleteMeal(i) {
      const {data,key}=getToday();
      data[key].meals.splice(i,1);
      saveData(data); renderMeals(); renderTotals(); renderHistory();
    }

    function renderHistory() {
      const data=loadData(), todayK=getTodayKey();
      const keys=Object.keys(data).filter(k=>k!==todayK).sort().reverse().slice(0,21);
      const el=document.getElementById('history-list');
      if(!keys.length){el.innerHTML='<div class="history-empty">Log meals for a few days to see history</div>';return;}
      el.innerHTML=keys.map(k=>{
        const total=(data[k]?.meals||[]).reduce((s,m)=>s+m.kcal,0);
        const pct=Math.min((total/GOAL)*100,100), over=total>GOAL;
        return `<div class="history-item">
          <span class="history-date">${formatDate(k)}</span>
          <div class="history-bar-wrap"><div class="history-bar-track">
            <div class="history-bar-fill${over?' over':''}" style="width:${pct}%"></div>
          </div></div>
          <span class="history-kcal${over?' over':''}">${total} kcal</span>
        </div>`;
      }).join('');
    }

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    let pendingEstimate=null;

    async function estimateMeal() {
      const input=document.getElementById('meal-input');
      const meal=input.value.trim();
      if(!meal) return;

      document.getElementById('log-btn').disabled=true;
      document.getElementById('estimating-state').style.display='flex';
      document.getElementById('preview-area').innerHTML='';
      document.getElementById('error-msg').style.display='none';

      try {
        const resp=await fetch('/api/estimate',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({meal})
        });
        if(!resp.ok) throw new Error('API error');
        const est=await resp.json();
        pendingEstimate=est;

        const {data,key}=getToday();
        const currentTotal=(data[key]?.meals||[]).reduce((s,m)=>s+m.kcal,0);
        const newTotal=currentTotal+est.kcal;
        const over=newTotal>GOAL;

        document.getElementById('preview-area').innerHTML=`
          <div class="preview-card${over?' warn-preview':''}">
            <div class="preview-name">${esc(est.name)}</div>
            <div class="preview-kcal${over?' over':''}">${est.kcal} kcal</div>
            <div class="preview-macros">Protein ${est.protein}g &nbsp;·&nbsp; Carbs ${est.carbs}g &nbsp;·&nbsp; Fat ${est.fat}g</div>
            <div class="preview-note">${esc(est.note)}</div>
            ${over?`<div class="preview-warn">Takes you to ${newTotal} kcal — ${newTotal-GOAL} over your goal</div>`:''}
            <div class="preview-actions">
              <button class="btn-save" onclick="saveMeal()">Save to log</button>
              <button class="btn-discard" onclick="discardEstimate()">Discard</button>
            </div>
          </div>`;
      } catch {
        document.getElementById('error-msg').textContent='Could not estimate — please try again.';
        document.getElementById('error-msg').style.display='block';
      }

      document.getElementById('estimating-state').style.display='none';
      document.getElementById('log-btn').disabled=false;
    }

    function saveMeal() {
      if(!pendingEstimate) return;
      const {data,key}=getToday();
      const time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      data[key].meals.push({...pendingEstimate,time});
      saveData(data);
      pendingEstimate=null;
      document.getElementById('meal-input').value='';
      document.getElementById('preview-area').innerHTML='';
      renderMeals(); renderTotals(); renderHistory();
    }

    function discardEstimate() {
      pendingEstimate=null;
      document.getElementById('preview-area').innerHTML='';
      document.getElementById('meal-input').value='';
    }

    document.getElementById('meal-input').addEventListener('keydown',e=>{if(e.key==='Enter')estimateMeal();});
    document.getElementById('today-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});

    renderTotals(); renderMeals(); renderHistory();
  </script>
</body>
</html>
